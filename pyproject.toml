[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cgrn"
version = "0.0.1"
description = "CGRN (working name) -- research scaffold for a compartmental, graph-based, iterative-refinement neural architecture. Currently in the design/specification phase; see docs/architecture_v0.md."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akhil Byju" }]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    # Byte-level BPE tokenizer training/encoding (nano-transformer exploratory
    # work, experiments/nano_transformer/) -- generic infra, not architecture.
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Kept separate: only needed once Experiment 006 (classical ML baselines) begins.
classical-ml = [
    "xgboost>=2.0",
]
# Paper A Phase 3 Part B: the official NeuMiss implementation, pinned to the
# exact commit the benchmark was run against. Install with --no-deps (its
# core NeuMissBlock needs only torch; the repo also lists pytorch-lightning,
# which is unused). See experiments/paper_a/real_reliability/models.py.
paper-a-phase3 = [
    "neumiss @ git+https://github.com/marineLM/NeuMiss_sota@7902b8dbe7114e8dc3010b5e8b132c35806a9d74",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
